<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Diagrama do Dashboards Hub: login único, a central e os painéis de comissões, comercial e financeiro, com perfis por setor e a base dos imports">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0d16"/>
      <stop offset="1" stop-color="#2a0f22"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.8" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cartao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <rect width="1600" height="1000" fill="url(#brilho)"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="120" y="150" fill="#fda4af" font-size="26" font-weight="600" letter-spacing="4">PAINÉIS DE DADOS</text>
    <text x="120" y="215" fill="#ffffff" font-size="52" font-weight="600">Um login, três painéis, cada setor no seu</text>

    <!-- login e central -->
    <rect x="120" y="290" width="300" height="96" rx="20" fill="url(#cartao)" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="170" cy="338" r="18" fill="none" stroke="#fda4af" stroke-width="3"/>
    <path d="M160 338h20M170 328v20" stroke="#fda4af" stroke-width="0"/>
    <rect x="158" y="334" width="24" height="18" rx="3" fill="#fda4af"/>
    <path d="M163 334v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#fda4af" stroke-width="3"/>
    <text x="206" y="333" fill="#fff1f3" font-size="28" font-weight="600">Login único</text>
    <text x="206" y="366" fill="#e3b7c1" font-size="21">senhas com bcrypt</text>

    <path d="M430 338h60" stroke="#fb7185" stroke-width="3"/><path d="M482 330l10 8-10 8" fill="none" stroke="#fb7185" stroke-width="3"/>

    <rect x="502" y="290" width="978" height="96" rx="20" fill="#fb7185" fill-opacity="0.13" stroke="#fb7185" stroke-opacity="0.6"/>
    <text x="542" y="333" fill="#fff1f3" font-size="28" font-weight="600">Central</text>
    <text x="542" y="366" fill="#e3b7c1" font-size="21">perfis Administrador, Comissões, Comercial e Financeiro · gestão de acessos · auditoria</text>

    <!-- três painéis -->
    <g>
      <rect x="120" y="440" width="430" height="300" rx="22" fill="url(#cartao)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="160" y="494" fill="#ffffff" font-size="30" font-weight="600">Comissões</text>
      <text x="160" y="528" fill="#e3b7c1" font-size="21">auditoria, lotes, parcelas, NF</text>
      <g fill="#fb7185">
        <rect x="160" y="640" width="36" height="60" rx="5" fill-opacity="0.55"/>
        <rect x="210" y="600" width="36" height="100" rx="5" fill-opacity="0.75"/>
        <rect x="260" y="620" width="36" height="80" rx="5" fill-opacity="0.6"/>
        <rect x="310" y="570" width="36" height="130" rx="5"/>
        <rect x="360" y="610" width="36" height="90" rx="5" fill-opacity="0.7"/>
        <rect x="410" y="585" width="36" height="115" rx="5" fill-opacity="0.85"/>
      </g>

      <rect x="585" y="440" width="430" height="300" rx="22" fill="url(#cartao)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="625" y="494" fill="#ffffff" font-size="30" font-weight="600">Comercial</text>
      <text x="625" y="528" fill="#e3b7c1" font-size="21">matriz de decisão 2×2, metas</text>
      <path d="M800 560v150M640 635h330" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
      <g fill="#fda4af">
        <circle cx="690" cy="600" r="14" fill-opacity="0.6"/>
        <circle cx="880" cy="585" r="24"/>
        <circle cx="925" cy="610" r="12" fill-opacity="0.7"/>
        <circle cx="720" cy="680" r="10" fill-opacity="0.5"/>
        <circle cx="850" cy="670" r="17" fill-opacity="0.8"/>
        <circle cx="760" cy="655" r="8" fill-opacity="0.6"/>
      </g>

      <rect x="1050" y="440" width="430" height="300" rx="22" fill="url(#cartao)" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="1090" y="494" fill="#ffffff" font-size="30" font-weight="600">Financeiro</text>
      <text x="1090" y="528" fill="#e3b7c1" font-size="21">DFC, fluxo de caixa, indicadores</text>
      <path d="M1090 690C1140 670 1170 640 1210 650S1290 600 1330 610 1400 570 1440 580" fill="none" stroke="#fb7185" stroke-width="5" stroke-linecap="round"/>
      <path d="M1090 690C1140 670 1170 640 1210 650S1290 600 1330 610 1400 570 1440 580V705H1090Z" fill="#fb7185" fill-opacity="0.15"/>
    </g>

    <!-- base -->
    <rect x="120" y="790" width="1360" height="96" rx="20" fill="url(#cartao)" stroke="#ffffff" stroke-opacity="0.14"/>
    <ellipse cx="180" cy="822" rx="26" ry="9" fill="none" stroke="#fda4af" stroke-width="3"/>
    <path d="M154 822v34c0 5 12 9 26 9s26-4 26-9v-34M154 839c0 5 12 9 26 9s26-4 26-9" fill="none" stroke="#fda4af" stroke-width="3"/>
    <text x="232" y="833" fill="#fff1f3" font-size="28" font-weight="600">Base dos imports (SQLite)</text>
    <text x="232" y="866" fill="#e3b7c1" font-size="21">reimportar atualiza sem duplicar · dados pessoais que nenhum cálculo usa ficam de fora</text>
  </g>
</svg>
